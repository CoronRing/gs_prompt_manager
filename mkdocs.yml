site_name: gs_prompt_manager
site_description: A lightweight Python package for managing and organizing prompt templates.
site_url: https://gs-prompt-manager.readthedocs.io/
repo_url: https://github.com/CoronRing/gs_prompt_manager
repo_name: CoronRing/gs_prompt_manager

docs_dir: docs

nav:
  - Home: index.md
  - User Guide: user-guide.md
  - Examples: examples.md
  - Migration Guide: migration.md
  - Changelog: changelog.md

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
  - admonition
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CoronRing/gs_prompt_manager
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/gs-prompt-manager/
