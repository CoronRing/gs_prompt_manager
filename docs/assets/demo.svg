  <rect width="760" height="592" rx="10" fill="#160f0a" stroke="#3d2a1c"/>
  <path d="M0 40 V10 a10 10 0 0 1 10 -10 H750 a10 10 0 0 1 10 10 V40 Z" fill="#231710"/>
