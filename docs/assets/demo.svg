  <text class="chrome" x="380" y="25" fill="#a08b7a" text-anchor="middle">python — ./prompts</text>

  <text class="m l0" y="84.0" xml:space="preserve"><tspan x="26.0" fill="#f0883e" textLength="18.0" lengthAdjust="spacingAndGlyphs">$ </tspan><tspan x="44.0" fill="#f7f1ea" textLength="261.0" lengthAdjust="spacingAndGlyphs">pip install gs-prompt-manager</tspan></text>
  <text class="m l1" y="110.0" xml:space="preserve"></text>
  <text class="m l2" y="136.0" xml:space="preserve"><tspan x="26.0" fill="#f0883e" textLength="18.0" lengthAdjust="spacingAndGlyphs">$ </tspan><tspan x="44.0" fill="#f7f1ea" textLength="54.0" lengthAdjust="spacingAndGlyphs">python</tspan></text>
  <text class="m l3" y="162.0" xml:space="preserve"><tspan x="26.0" fill="#f0883e" textLength="36.0" lengthAdjust="spacingAndGlyphs">&gt;&gt;&gt; </tspan><tspan x="62.0" fill="#f7f1ea" textLength="387.0" lengthAdjust="spacingAndGlyphs">from gs_prompt_manager import PromptManager</tspan></text>
  <text class="m l4" y="188.0" xml:space="preserve"><tspan x="26.0" fill="#f0883e" textLength="36.0" lengthAdjust="spacingAndGlyphs">&gt;&gt;&gt; </tspan><tspan x="62.0" fill="#f7f1ea" textLength="270.0" lengthAdjust="spacingAndGlyphs">m = PromptManager("./prompts")</tspan></text>
  <text class="m l5" y="214.0" xml:space="preserve"></text>
  <text class="m l6" y="240.0" xml:space="preserve"><tspan x="26.0" fill="#f0883e" textLength="36.0" lengthAdjust="spacingAndGlyphs">&gt;&gt;&gt; </tspan><tspan x="62.0" fill="#f7f1ea" textLength="234.0" lengthAdjust="spacingAndGlyphs">m.get_prompt_group_names()</tspan></text>
  <text class="m l7" y="266.0" xml:space="preserve"><tspan x="26.0" fill="#ffb86b" textLength="108.0" lengthAdjust="spacingAndGlyphs">['Reviewer']</tspan></text>
  <text class="m l8" y="292.0" xml:space="preserve"><tspan x="26.0" fill="#f0883e" textLength="36.0" lengthAdjust="spacingAndGlyphs">&gt;&gt;&gt; </tspan><tspan x="62.0" fill="#f7f1ea" textLength="261.0" lengthAdjust="spacingAndGlyphs">m.Reviewer.get_prompt_names()</tspan></text>
  <text class="m l9" y="318.0" xml:space="preserve"><tspan x="26.0" fill="#ffb86b" textLength="261.0" lengthAdjust="spacingAndGlyphs">['chat', 'verdict', 'system']</tspan></text>
  <text class="m l10" y="344.0" xml:space="preserve"></text>
  <text class="m l11" y="370.0" xml:space="preserve"><tspan x="26.0" fill="#f0883e" textLength="36.0" lengthAdjust="spacingAndGlyphs">&gt;&gt;&gt; </tspan><tspan x="62.0" fill="#f7f1ea" textLength="414.0" lengthAdjust="spacingAndGlyphs">print(m.Reviewer.system({"language": "Rust"}))</tspan></text>
  <text class="m l12" y="396.0" xml:space="preserve"><tspan x="26.0" fill="#cdbfb3" textLength="279.0" lengthAdjust="spacingAndGlyphs">You are a senior Rust reviewer.</tspan></text>
  <text class="m l13" y="422.0" xml:space="preserve"><tspan x="26.0" fill="#cdbfb3" textLength="351.0" lengthAdjust="spacingAndGlyphs">Focus on correctness first, style last.</tspan></text>
  <text class="m l14" y="448.0" xml:space="preserve"><tspan x="26.0" fill="#cdbfb3" textLength="324.0" lengthAdjust="spacingAndGlyphs">Session started 2026-09-07 01:13:24.</tspan></text>
  <text class="m l15" y="474.0" xml:space="preserve"></text>
  <text class="m l16" y="500.0" xml:space="preserve"><tspan x="26.0" fill="#f0883e" textLength="36.0" lengthAdjust="spacingAndGlyphs">&gt;&gt;&gt; </tspan><tspan x="62.0" fill="#f7f1ea" textLength="243.0" lengthAdjust="spacingAndGlyphs">print(m.Reviewer.verdict())</tspan></text>
  <text class="m l17" y="526.0" xml:space="preserve"><tspan x="26.0" fill="#cdbfb3" textLength="432.0" lengthAdjust="spacingAndGlyphs">Answer with exactly one word: approve or reject.</tspan></text>

  <text class="m cursor" x="26.0" y="552.0" fill="#f0883e" xml:space="preserve">&gt;&gt;&gt; <tspan fill="#f7f1ea">&#9608;</tspan></text>
